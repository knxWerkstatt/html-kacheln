<!DOCTYPE html>
<!--
  EnergieKachel - Darstellung (HTML-SDK): Energiefluss Inselanlage
  PV 3 kW, PV 6 kW -> Hybrid-WR SI 8 mit Batterie -> Verbrauch -> Brunnenpumpe, Hauswasserwerk, Poolpumpe, Rest
  Hannes Hacker - KNX Werkstatt
  Version: v2
  Erstellt: 16.11.2026, 21:17
  v2: Auge (Detailansicht) in der Fußzeile aller 7 Kästen, Bedienung wie Zahnrad der PoolKachel (halten, ui.hold);
      Zeitstempel von heute nur "HH:MM".
  Grundlage: energie_mockup_v2.html, energie_nachrichtenvertrag_v2.md; Regeln wie PoolKachel v3.
  Die Kachel rechnet nicht: Polarität, Restverbrauch, Gültigkeit und Zeitstempel kommen fertig vom Modul.
  Sie leitet nur Fluss und Batterierichtung aus power und ui.thr ab und formatiert Zeitstempel.
  Farben themenneutral (abgeleitet von currentColor), Text per prefers-color-scheme.
-->
<html>
<head>
<meta charset="UTF-8">
<style>
/* Schrift und Textfarbe: Symcon-Theme wird nicht übernommen (zu prüfen), daher Systemschrift und OS-Farbschema */
html{color:#1d2733}
@media (prefers-color-scheme:dark){html{color:#e6ecf2}}
html,body{margin:0;background:transparent;font-size:14px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
/* Kein eigenes Scrollen: Wischgesten sollen bei der Symcon-Seite ankommen */
html,body{overflow:hidden}
body{box-sizing:border-box;padding:4px}
.tile{--good:#22b35e;--warn:#e9a100;--crit:#e5484d;--accent:#e08a1e;--sun:#f2b705;--bat:#22b35e;
  --muted:color-mix(in srgb,currentColor 60%,transparent);
  --line:color-mix(in srgb,currentColor 18%,transparent);
  --pipe:color-mix(in srgb,currentColor 22%,transparent);
  --well:color-mix(in srgb,currentColor 6%,transparent);
  container:tile / inline-size;font-size:14px}
.ef{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;
  grid-template-areas:"pv3 pv6" "p3 p6" "wr wr" "load load" "cons cons" "foot foot"}
#bPv3{grid-area:pv3} #bPv6{grid-area:pv6} #pPv3{grid-area:p3} #pPv6{grid-area:p6} #pPvAll{grid-area:p3;display:none}
#bWr{grid-area:wr} .load{grid-area:load} .cons{grid-area:cons} .tfoot{grid-area:foot}

.box{position:relative;border:1.5px solid color-mix(in srgb,var(--good) 45%,var(--line));border-radius:10px;
  padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .3s,background-color .3s}
.box.stale{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,transparent)}
.box.unknown,.box.derived{border-color:var(--line)}
.stamp{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:3}
.box.stale .stamp{display:grid}
.stamp span{transform:rotate(-10deg);border:2.5px solid var(--crit);border-radius:6px;padding:.2em .5em;color:var(--crit);
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:center;line-height:1.15;font-size:clamp(10px,2.6cqi,16px);
  background:color-mix(in srgb,var(--crit) 6%,transparent)}
.box.big .stamp span{font-size:clamp(12px,3.6cqi,20px)}

.bh{display:flex;align-items:center;gap:8px;min-height:24px}
.bh svg{width:24px;height:24px;flex:none}
.bh h3{margin:0;font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bPv6 .bh{padding-right:22px}                 /* breit: Vergrößern-Symbol sitzt über PV 6 kW */
.val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;transition:opacity .3s}
.sub{font-size:11px;color:var(--muted);min-height:14px}
.box.stale .val,.box.stale .inner{opacity:.4}

.foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;min-height:16px}
.foot .ft{overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Auge (Detailansicht): Fußzeile rechts, Bedienung wie Zahnrad der PoolKachel; bleibt bei getrennter Verbindung bedienbar */
.eye{position:relative;width:34px;height:34px;margin:-9px -8px -9px auto;padding:0;border:0;background:transparent;z-index:4;
  color:var(--muted);cursor:pointer;flex:none;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
.eye[hidden]{display:none}
.eye svg{position:absolute;inset:3px;width:28px;height:28px}
.eye .ring{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:82;stroke-dashoffset:82;transform:rotate(-90deg);transform-origin:15px 15px}
.eye.hold{color:var(--accent)}
.eye.hold .ring{stroke-dashoffset:0;transition:stroke-dashoffset var(--hold,2s) linear}
.lamp{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.ok .lamp{background:var(--good)}
.lost .lamp{background:var(--crit);animation:blink 1.6s ease-in-out infinite}
.foot.lost{color:var(--crit)}
@keyframes blink{50%{opacity:.25}}

/* Leitungen senkrecht (PV -> WR, WR -> Verbraucher) */
.vpipe{display:flex;flex-direction:column;align-items:center;height:30px;justify-self:center}
.vpipe .bar{flex:1;width:6px;background:var(--pipe);position:relative;overflow:hidden;border-radius:3px 3px 0 0}
.vpipe .head{width:14px;height:8px;background:var(--pipe);clip-path:polygon(0 0,100% 0,50% 100%)}
.vpipe .bar::after{content:"";position:absolute;inset:0;opacity:0;
  background:repeating-linear-gradient(180deg,var(--c,var(--sun)) 0 7px,transparent 7px 14px);background-size:100% 14px}
.vpipe.on .bar::after{opacity:1;animation:down .7s linear infinite}
.vpipe.on .head{background:var(--c,var(--sun))}
@keyframes down{from{background-position:0 -14px}to{background-position:0 0}}
.load{grid-column:1/3;display:flex;justify-content:center;align-items:center;gap:10px;height:40px}
.load .vpipe{height:40px}
.load .lbl{font-size:12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.load .lbl>span{color:var(--muted)}
.load .lbl b{font-size:15px;color:currentColor;font-weight:600;font-variant-numeric:tabular-nums}
.load .lbl.unsure b{opacity:.4}
.load .lbl em{font-style:normal;color:var(--crit);font-size:10px}
.load .sp{flex:1} .load .sp:last-child{text-align:left}

/* Wechselrichter mit Batterie */
#bWr{grid-column:1/3}
.inner{display:flex;align-items:center;gap:10px;transition:opacity .3s}
.wrpart{flex:none;min-width:0;display:flex;flex-direction:column;gap:2px}
.hpipe{flex:1 1 auto;max-width:220px;min-width:40px;margin-left:auto;display:flex;align-items:center}
.hpipe .bar{flex:1;height:6px;background:var(--pipe);position:relative;overflow:hidden}
.hpipe .head{width:8px;height:14px;background:var(--pipe);flex:none}
.hpipe .head.l{clip-path:polygon(100% 0,0 50%,100% 100%)}
.hpipe .head.r{clip-path:polygon(0 0,100% 50%,0 100%)}
.hpipe .head{visibility:hidden}
.hpipe.dis .head.l,.hpipe.chg .head.r{visibility:visible;background:var(--bat)}
.hpipe .bar::after{content:"";position:absolute;inset:0;opacity:0;
  background:repeating-linear-gradient(90deg,var(--bat) 0 7px,transparent 7px 14px);background-size:14px 100%}
.hpipe.dis .bar::after{opacity:1;animation:left .7s linear infinite}
.hpipe.chg .bar::after{opacity:1;animation:right .7s linear infinite}
@keyframes left{from{background-position:14px 0}to{background-position:0 0}}
@keyframes right{from{background-position:0 0}to{background-position:14px 0}}
.batpart{display:flex;align-items:center;gap:8px;flex:none}
.batpart svg{width:30px;height:48px}
.soc{display:flex;flex-direction:column;align-items:flex-start}
.soc .val{font-size:20px}

/* Verbraucher */
.cons{grid-column:1/3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cons .box{padding:8px 10px;overflow:hidden}
.cons .box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;opacity:0;
  background:repeating-linear-gradient(90deg,var(--accent) 0 7px,transparent 7px 14px);background-size:14px 100%}
.cons .box.run::before{opacity:1;animation:right .7s linear infinite}
.cons .val{font-size:17px}
.cons .bh h3{font-size:12px}
.cons .bh svg{width:20px;height:20px}
.rotor{transform-origin:15px 15px}
.box.run .rotor{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Gesamt-Fußzeile */
.tfoot{grid-column:1/3;display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.tfoot time{margin-left:auto;font-variant-numeric:tabular-nums}

/* Keine Verbindung: keine Bewegung */
.box.stale .rotor,.box.stale::before{animation:none!important}

/* Schmal (< 640 px, Handy): alles untereinander, PV und Verbraucher als Zeilen */
@container tile (max-width:639px){
  .ef{grid-template-columns:minmax(0,1fr);row-gap:6px;
    grid-template-areas:"pv3" "pv6" "p3" "wr" "load" "cons" "foot"}
  #pPv3,#pPv6{display:none} #pPvAll{display:flex}
  .vpipe{height:22px} .load,.load .vpipe{height:34px}
  .cons{grid-template-columns:minmax(0,1fr);gap:6px}
  /* Zeile: Kopf und Fußzeile links, Wert rechts */
  #bPv3,#bPv6,.cons .box{display:grid;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"bh val" "foot val";column-gap:10px;row-gap:0;align-items:center;padding:6px 10px}
  #bPv3 .bh,#bPv6 .bh,.cons .bh{grid-area:bh;min-height:22px}
  #bPv3 .val,#bPv6 .val,.cons .val{grid-area:val;font-size:18px}
  #bPv3 .foot,#bPv6 .foot,.cons .foot{grid-area:foot;padding-left:28px}
  .cons .foot{padding-left:28px}
  #bPv6 .bh{padding-right:0}
  #bPv3{padding-right:34px}                   /* Vergrößern-Symbol sitzt jetzt über PV 3 kW */
  .stamp span{font-size:11px}
  /* Zeile: Stempel über dem Wert rechts, damit "Stand …" links lesbar bleibt */
  #bPv3 .stamp,#bPv6 .stamp,.cons .stamp{justify-items:end;padding-right:8px}
  #bPv3 .stamp span,#bPv6 .stamp span,.cons .stamp span{transform:rotate(-6deg);font-size:10px;letter-spacing:.06em}
  .box.big .stamp span{font-size:14px}
  .wrpart .val{font-size:19px}
  .hpipe{max-width:none}
  .load .lbl b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.tile *{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <section class="tile" aria-label="Energiefluss">
    <div class="ef">
      <!-- PV -->
      <div class="box" id="bPv3">
        <div class="stamp" aria-hidden="true"><span>Keine Verbindung</span></div>
        <div class="bh"><svg viewBox="0 0 30 30"><circle cx="24" cy="6" r="4" fill="var(--sun)"/><path d="M4 26 L8 12 H22 L26 26 Z" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M6 19 H24 M11 12 L10 26 M19 12 L20 26" stroke="var(--accent)" stroke-width="1.5"/></svg><h3>PV 3 kW</h3></div>
        <div class="val" id="vPv3">–</div>
        <div class="foot"><span class="lamp"></span><span class="ft">–</span><button type="button" class="eye" data-k="pv3" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
      </div>
      <div class="box" id="bPv6">
        <div class="stamp" aria-hidden="true"><span>Keine Verbindung</span></div>
        <div class="bh"><svg viewBox="0 0 30 30"><circle cx="24" cy="6" r="4" fill="var(--sun)"/><path d="M4 26 L8 12 H22 L26 26 Z" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M6 19 H24 M11 12 L10 26 M19 12 L20 26" stroke="var(--accent)" stroke-width="1.5"/></svg><h3>PV 6 kW</h3></div>
        <div class="val" id="vPv6">–</div>
        <div class="foot"><span class="lamp"></span><span class="ft">–</span><button type="button" class="eye" data-k="pv6" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
      </div>
      <div class="vpipe" id="pPv3"><span class="bar"></span><span class="head"></span></div>
      <div class="vpipe" id="pPv6"><span class="bar"></span><span class="head"></span></div>
      <div class="vpipe" id="pPvAll"><span class="bar"></span><span class="head"></span></div>

      <!-- Hybrid-WR mit Batterie -->
      <div class="box big" id="bWr">
        <div class="stamp" aria-hidden="true"><span>Keine Verbindung</span></div>
        <div class="inner">
          <div class="wrpart">
            <div class="bh"><svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M9 17 q3 -6 6 0 t6 0" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><h3>Hybrid-WR SI 8</h3></div>
            <div class="sub">Batterie</div>
            <div class="val" id="vBat">–</div>
            <div class="sub" id="vBatDir">–</div>
          </div>
          <div class="hpipe" id="pBat"><span class="head l"></span><span class="bar"></span><span class="head r"></span></div>
          <div class="batpart">
            <svg viewBox="0 0 30 48" aria-hidden="true"><rect x="10" y="1" width="10" height="4" rx="1" fill="var(--muted)"/><rect x="2" y="5" width="26" height="42" rx="4" fill="none" stroke="var(--muted)" stroke-width="2"/><rect id="socFill" x="5" y="44" width="20" height="0" rx="2" fill="var(--bat)"/></svg>
            <div class="soc"><span class="sub">Ladestand</span><span class="val" id="vSoc">–</span></div>
          </div>
        </div>
        <div class="foot"><span class="lamp"></span><span class="ft">–</span><button type="button" class="eye" data-k="wr" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
      </div>

      <!-- Verbrauch -->
      <div class="load">
        <span class="sp"></span>
        <div class="vpipe" id="pLoad" style="--c:var(--accent)"><span class="bar"></span><span class="head"></span></div>
        <span class="sp"><span class="lbl" id="lLoad"><span>Verbrauch</span><b>–</b><em></em></span></span>
      </div>

      <div class="cons">
        <div class="box" id="bBrunnen">
          <div class="stamp" aria-hidden="true"><span>Keine Verbindung</span></div>
          <div class="bh"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/><g class="rotor"><path d="M15 15 L15 5 A10 10 0 0 1 23 10 Z M15 15 L25 18 A10 10 0 0 1 18 25 Z M15 15 L8 22 A10 10 0 0 1 5 12 Z" fill="var(--accent)"/></g></svg><h3>Brunnenpumpe</h3></div>
          <div class="val">–</div><div class="foot"><span class="lamp"></span><span class="ft">–</span><button type="button" class="eye" data-k="brunnen" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
        </div>
        <div class="box" id="bHww">
          <div class="stamp" aria-hidden="true"><span>Keine Verbindung</span></div>
          <div class="bh"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/><g class="rotor"><path d="M15 15 L15 5 A10 10 0 0 1 23 10 Z M15 15 L25 18 A10 10 0 0 1 18 25 Z M15 15 L8 22 A10 10 0 0 1 5 12 Z" fill="var(--accent)"/></g></svg><h3>Hauswasserwerk</h3></div>
          <div class="val">–</div><div class="foot"><span class="lamp"></span><span class="ft">–</span><button type="button" class="eye" data-k="hww" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
        </div>
        <div class="box" id="bPool">
          <div class="stamp" aria-hidden="true"><span>Keine Verbindung</span></div>
          <div class="bh"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/><g class="rotor"><path d="M15 15 L15 5 A10 10 0 0 1 23 10 Z M15 15 L25 18 A10 10 0 0 1 18 25 Z M15 15 L8 22 A10 10 0 0 1 5 12 Z" fill="var(--accent)"/></g></svg><h3>Poolpumpe</h3></div>
          <div class="val">–</div><div class="foot"><span class="lamp"></span><span class="ft">–</span><button type="button" class="eye" data-k="pool" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
        </div>
        <div class="box derived" id="bRest">
          <div class="bh"><svg viewBox="0 0 30 30"><path d="M4 15 L15 5 L26 15 M7 13 V26 H23 V13" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><rect x="13" y="18" width="5" height="8" fill="var(--accent)"/></svg><h3>Restverbraucher</h3></div>
          <div class="val">–</div><div class="foot"><span class="ft">–</span><button type="button" class="eye" data-k="rest" hidden aria-label="Details öffnen (halten)"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring" cx="15" cy="15" r="13"/><path d="M5 15 Q15 6 25 15 Q15 24 5 15 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="15" r="3.2" fill="currentColor"/></svg></button></div>
        </div>
      </div>

      <div class="tfoot" id="tFoot"><span class="lamp"></span><span id="tTxt">–</span><time id="tTime"></time></div>
    </div>
  </section>

<script>
const $ = id => document.getElementById(id);
const DASH = '–';
const has = v => v !== null && v !== undefined;
const two = n => String(n).padStart(2, '0');
// Zeitstempel: heute nur "HH:MM", sonst "TT.MM. HH:MM" (Platz für das Auge in schmalen Kästen)
function stamp(sec) {
  if (!has(sec) || sec <= 0) return DASH;
  const d = new Date(sec * 1000), hm = `${two(d.getHours())}:${two(d.getMinutes())}`;
  return d.toDateString() === new Date().toDateString() ? hm : `${two(d.getDate())}.${two(d.getMonth() + 1)}. ${hm}`;
}
const txt = o => o && has(o.txt) ? String(o.txt) : DASH;
let THR = 10, holdMs = 2000;
const targets = {};
const flows = o => !!o && o.online === true && has(o.power) && o.power > THR;

// Verbindung je Kasten: grün ok, rot mit Stempel und "Stand …", neutral unbekannt
function setConn(el, o) {
  const c = o ? o.online : null;
  el.classList.toggle('stale', c === false);
  el.classList.toggle('unknown', !has(c));
  const f = el.querySelector('.foot'); if (!f) return;
  f.classList.toggle('ok', c === true);
  f.classList.toggle('lost', c === false);
  const t = f.querySelector('.ft');
  t.textContent = c === true ? 'verbunden · ' + stamp(o.ts)
    : c === false ? 'Stand ' + stamp(o.ts) : 'Verbindung unbekannt';
}

function render(m) {
  if (m.ui && has(m.ui.thr)) THR = Number(m.ui.thr);
  if (m.ui && has(m.ui.hold)) holdMs = Math.max(0, Math.round(Number(m.ui.hold))) * 1000;
  // Ziel des Auges je Kasten; ohne Ziel kein Auge
  const cons0 = m.cons || {};
  const src = { pv3: m.pv3, pv6: m.pv6, wr: m.wr, brunnen: cons0.brunnen, hww: cons0.hww, pool: cons0.pool, rest: m.rest };
  document.querySelectorAll('.eye').forEach(b => {
    const o = src[b.dataset.k];
    targets[b.dataset.k] = o && has(o.cfg) ? Number(o.cfg) : null;
    b.hidden = targets[b.dataset.k] === null;
  });
  // PV
  [['pv3', 'bPv3', 'vPv3', 'pPv3'], ['pv6', 'bPv6', 'vPv6', 'pPv6']].forEach(([k, b, v, p]) => {
    setConn($(b), m[k]); $(v).textContent = txt(m[k]);
    $(p).classList.toggle('on', flows(m[k]));
  });
  $('pPvAll').classList.toggle('on', flows(m.pv3) || flows(m.pv6));   // schmal: gemeinsame Leitung

  // Hybrid-WR mit Batterie: positiv = Entladen
  const w = m.wr || {};
  setConn($('bWr'), w);
  $('vBat').textContent = txt(w);
  $('vSoc').textContent = txt(w.soc);
  const soc = w.soc && has(w.soc.raw) ? Math.max(0, Math.min(100, Number(w.soc.raw))) : 0;
  const h = soc * 38 / 100, sf = $('socFill');
  sf.setAttribute('height', h); sf.setAttribute('y', 44 - h);
  const pb = $('pBat'); pb.classList.remove('dis', 'chg');
  let dir = DASH;
  if (has(w.power)) {
    if (w.power > THR) { dir = 'entlädt'; if (w.online === true) pb.classList.add('dis'); }
    else if (w.power < -THR) { dir = 'lädt'; if (w.online === true) pb.classList.add('chg'); }
    else dir = 'ruht';
  }
  $('vBatDir').textContent = dir;

  // Verbrauch: Text immer, ungültig -> abgeblendet und Hinweis
  const L = $('lLoad'), ld = m.load || {};
  L.querySelector('b').textContent = txt(ld);
  L.classList.toggle('unsure', ld.valid !== true);
  L.querySelector('em').textContent = ld.valid === true ? '' : 'Quelle getrennt';
  $('pLoad').classList.toggle('on', ld.valid === true && has(ld.power) && ld.power > THR);

  // Verbraucher
  const cons = m.cons || {};
  [['brunnen', 'bBrunnen'], ['hww', 'bHww'], ['pool', 'bPool']].forEach(([k, b]) => {
    const el = $(b);
    setConn(el, cons[k]);
    el.querySelector('.val').textContent = txt(cons[k]);
    el.classList.toggle('run', flows(cons[k]));
  });
  const r = m.rest || {}, rb = $('bRest');
  rb.querySelector('.val').textContent = txt(r);
  rb.querySelector('.foot .ft').textContent = has(r.txt) ? 'berechnet'
    : 'unvollständig' + (r.missing && r.missing.length ? ': ' + r.missing.join(', ') : '');
  rb.classList.toggle('run', has(r.txt) && has(r.power) && r.power > THR);

  // Gesamt-Fußzeile
  const lost = Array.isArray(m.lost) ? m.lost : [];
  const tf = $('tFoot');
  tf.classList.toggle('lost', lost.length > 0);
  tf.classList.toggle('ok', lost.length === 0);
  $('tTxt').textContent = lost.length ? 'getrennt: ' + lost.join(', ') : 'keine Quelle getrennt';
  $('tTime').textContent = 'Stand ' + stamp(m.ts);
}

// Auge: Ziel-ID (cfg) und Haltezeit (ui.hold) kommen vom Modul; 0 s = Öffnen per kurzem Antippen.
// Halten -> openObject(cfg); Loslassen oder Verrutschen > 10 px bricht ab (wie Zahnrad der PoolKachel).
const MOVE_PX = 10;
document.querySelectorAll('.eye').forEach(g => {
  let timer = null, armed = false, x0 = 0, y0 = 0;
  const target = () => targets[g.dataset.k];
  const open = () => {
    if (typeof openObject === 'function') openObject(target());
    else console.warn('EnergieKachel: openObject nicht verfügbar');
  };
  const cancel = () => { clearTimeout(timer); timer = null; armed = false; g.classList.remove('hold'); };
  g.addEventListener('pointerdown', e => {
    if (target() === null || target() === undefined) return;
    e.preventDefault();
    try { g.setPointerCapture(e.pointerId); } catch (err) { /* nicht kritisch */ }
    x0 = e.clientX; y0 = e.clientY;
    if (holdMs === 0) { armed = true; return; }   // sofort: öffnet beim Loslassen ohne Verrutschen
    g.style.setProperty('--hold', holdMs + 'ms');
    g.classList.add('hold');
    timer = setTimeout(() => { cancel(); open(); }, holdMs);
  });
  g.addEventListener('pointermove', e => {
    if ((timer || armed) && Math.hypot(e.clientX - x0, e.clientY - y0) > MOVE_PX) cancel();
  });
  g.addEventListener('pointerup', () => { const tap = armed; cancel(); if (tap) open(); });
  ['pointercancel', 'lostpointercapture'].forEach(ev => g.addEventListener(ev, cancel));
  g.addEventListener('contextmenu', e => e.preventDefault());
});

// Nur Nachrichten unseres Moduls annehmen (Vertrag energie v2: pv3, wr, cons).
// Alles andere wird verworfen, die letzte gültige Anzeige bleibt stehen.
function isOwnMessage(m) {
  return m !== null && typeof m === 'object'
    && ['pv3', 'wr', 'cons'].every(k => m[k] !== null && typeof m[k] === 'object');
}

// Vom Modul aufgerufen (UpdateVisualizationValue bzw. erste Anzeige); Daten kommen als JSON-String
function handleMessage(data) {
  let m;
  try {
    m = typeof data === 'string' ? JSON.parse(data) : data;
  } catch (e) {
    console.warn('EnergieKachel: Nachricht verworfen (kein JSON)', data);
    return;
  }
  if (!isOwnMessage(m)) {
    console.warn('EnergieKachel: Nachricht verworfen (fremdes Format)', data);
    return;
  }
  render(m);
}
